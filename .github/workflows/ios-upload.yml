name: Build and Upload iOS

on:
  workflow_dispatch:

jobs:
  check-project:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List files in repo
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -not -path '*/.*'
