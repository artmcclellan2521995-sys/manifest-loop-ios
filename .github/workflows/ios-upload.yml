name: Build and Upload iOS

on:
  workflow_dispatch:

jobs:
  check-scheme:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci || npm install
          npx cap sync ios

      - name: List iOS schemes
        run: xcodebuild -list -project ios/App/App.xcodeproj
